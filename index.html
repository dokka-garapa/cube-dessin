<style>

</div>
<div id="gv" hidden><div class="gbox"><img id="gimg" alt="GIF"><div class="msg" data-i="gmsg"></div><div class="btns"><button id="gsave" class="main" data-i="gsave"></button><button id="gclose" data-i="gclose"></button></div></div></div>
<script>
const W=440,H=320,CX=W/2,CY=H/2,S=62,D=700;
/* 上級にもツメ指示を付ける場合 true／大きさの変化だけにする場合 false */
const ADV_TSUME=true;
const FONT='system-ui,"Hiragino Sans","Noto Sans JP",sans-serif';

/* ===== 言語 ===== */
const I={
ja:{
 title:`立方体の「デッサン割り」ゲーム・アニメーター動画マン体験`,langBtn:`English`,
 c0:`初級`,c1:`中級`,c2:`上級`,
 l0:`①下書き（薄い灰色）`,l1:`②清書（黒・採点対象）`,
 hb:`ヒント`,hbOff:`ヒントを消す`,undo:`1本戻す`,clr:`この段階を消す`,go:`採点する`,nx:`次の出題`,play:`▶ 再生`,stop:`■ 停止`,gif:`GIF保存`,gifBusy:`書き出し中…`,gtitle:`立方体「デッサン割り」ゲーム`,gsave:`保存／共有`,gclose:`閉じる`,gmsg:`「保存／共有」を押すか、保存が始まらないときは画像を長押し（PCは右クリック）して保存してください。`,
 h0:`赤と水色の立方体の「真ん中のポーズ」を、見える線だけで何本でも描こう。まず①下書き（薄い灰色）、次に②清書（黒）。採点は清書の線だけで行います。☆と△は同じ角です（赤→水色へ移動）。`,
 h1:`「ツメ」は、中割りを片方の原画に寄せて入れる指示です。上のツメ指示どおり、赤寄り／水色寄りのポーズを見える線だけで描こう。まず①下書き、次に②清書（黒・採点対象）。☆と△は同じ角です。`,
 h2:`赤と水色で立方体の大きさが違います。大きさの変化も考えて、ツメ指示の位置のポーズを描こう。まず①下書き、次に②清書（黒・採点対象）。☆と△は同じ角です。`,
 h2n:`赤と水色で立方体の大きさが違います。大きさの変化も考えて、真ん中のポーズを描こう。まず①下書き、次に②清書（黒・採点対象）。☆と△は同じ角です。`,
 tsR:`ツメ指示：赤寄り`,tsB:`ツメ指示：水色寄り`,
 noStroke:`②清書（黒）の線がありません。清書の線を引いてから採点しよう。`,
 rv:`振り返り`,pt:`点　`,
 cm0:`原画マン拍手！ほぼ完璧`,cm1:`このまま動画チェックを通りそう`,cm2:`あと一歩。直しが入るかも`,cm3:`リテイク。ヒントを見てもう一度ねらってみよう`,
 qn:`{n}問目`,hu:`・ヒント使用`,
 note:`緑が正解の立方体です（{q}）。「▶ 再生」で動きを確認、「GIF保存」で書き出し、「次の出題」で続けます。`
},
en:{
 title:`Cube "Dessin-wari" Game – Try Being an Animation Inbetweener`,langBtn:`日本語`,
 c0:`Beginner`,c1:`Intermediate`,c2:`Advanced`,
 l0:`① Rough (light gray)`,l1:`② Clean-up (black, scored)`,
 hb:`Hint`,hbOff:`Hide hint`,undo:`Undo stroke`,clr:`Clear this layer`,go:`Score`,nx:`Next`,play:`▶ Play`,stop:`■ Stop`,gif:`Save GIF`,gifBusy:`Exporting…`,gtitle:`Cube "Dessin-wari" Game`,gsave:`Save / Share`,gclose:`Close`,gmsg:`Press "Save / Share". If nothing downloads, press and hold the image (or right-click on a computer) to save it.`,
 h0:`Draw the pose halfway between the red and blue cubes, using visible lines only (as many strokes as you like). Start with ① rough (light gray), then ② clean-up (black). Only clean-up lines are scored. ☆ and △ mark the same corner (moving from red to blue).`,
 h1:`"Tsume" tells you to place the in-between closer to one of the two key drawings. Follow the Tsume instruction above and draw the pose closer to red or blue, visible lines only. Rough in ① first, then clean up in ② (scored). ☆ and △ mark the same corner.`,
 h2:`The red and blue cubes differ in size. Take the size change into account and draw the pose at the position the Tsume instruction shows. Rough in ①, clean up in ② (scored). ☆ and △ mark the same corner.`,
 h2n:`The red and blue cubes differ in size. Take the size change into account and draw the halfway pose. Rough in ①, clean up in ② (scored). ☆ and △ mark the same corner.`,
 tsR:`Tsume: closer to RED`,tsB:`Tsume: closer to BLUE`,
 noStroke:`There are no ② clean-up (black) lines yet. Draw your clean-up lines, then score.`,
 rv:`Review`,pt:`pts `,
 cm0:`Key animator applause! Nearly perfect`,cm1:`Looks ready to pass the inbetween check`,cm2:`Almost there. You may get corrections`,cm3:`Retake. Peek at the hint and try again`,
 qn:`Q{n}`,hu:`, hint used`,
 note:`Green is the correct cube ({q}). Press "▶ Play" to check the motion, "Save GIF" to export it, or "Next" to continue.`
}};
let lang='ja';try{const s=localStorage.getItem('dw-lang');if(s==='en'||s==='ja')lang=s}catch(_){}
const T=k=>I[lang][k];

/* ===== 基本 ===== */
const cv=document.getElementById('c'),$=id=>document.getElementById(id);let ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,3);cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const R=(a,b)=>a+Math.random()*(b-a),sg=()=>Math.random()<.5?-1:1;
let q=null,strokes=[],drafts=[],layer=0,dl=0,drawing=false,hint=false,result=false,n=0,course=0,rs=null;
let playing=false,pf=0,raf=0,t0=0,pid=null,ptype='';

/* ===== 立方体 ===== */
function rot(p,y,x,z){let[a,b,c]=p,t;t=a*Math.cos(y)+c*Math.sin(y);c=-a*Math.sin(y)+c*Math.cos(y);a=t;t=b*Math.cos(x)-c*Math.sin(x);c=b*Math.sin(x)+c*Math.cos(x);b=t;t=a*Math.cos(z)-b*Math.sin(z);b=a*Math.sin(z)+b*Math.cos(z);a=t;return[a,b,c]}
function build(p){const SS=S*(p.s||1),V=[],P=[];
 for(let i=0;i<8;i++){const r=rot([i&1?SS:-SS,i&2?SS:-SS,i&4?SS:-SS],p.y,p.x,p.z),w=[r[0]+p.tx,r[1]+p.ty,r[2]+D];V.push(w);P.push([CX+D*w[0]/w[2],CY+D*w[1]/w[2]])}
 const fr=[];for(let a=0;a<3;a++)for(let s=0;s<2;s++){const e=[0,0,0];e[a]=s?1:-1;const nn=rot(e,p.y,p.x,p.z),c=rot(e.map(v=>v*SS),p.y,p.x,p.z),w=[c[0]+p.tx,c[1]+p.ty,c[2]+D];fr[a*2+s]=nn[0]*w[0]+nn[1]*w[1]+nn[2]*w[2]<0}
 const E=[];for(let u=0;u<8;u++)for(let a=0;a<3;a++){if(u&(1<<a))continue;const v=u|(1<<a),o=[0,1,2].filter(k=>k!==a);E.push({a:P[u],b:P[v],vis:fr[o[0]*2+((u>>o[0])&1)]||fr[o[1]*2+((u>>o[1])&1)]})}
 return{P,E,vv:V.map((_,i)=>[0,1,2].some(k=>fr[k*2+((i>>k)&1)]))}}
const ok=o=>o.P.every(p=>p[0]>30&&p[0]<W-30&&p[1]>30&&p[1]<H-30);

/* 初級：真ん中／中級：ツメ指示あり／上級：大きさが変わる（＋ツメ指示） */
function gen(){const tsu=course===1||(course===2&&ADV_TSUME),adv=course===2;let r;for(let t=0;t<300;t++){
 const y0=R(-1,1),dy=R(.5,1.1)*sg(),x0=R(.25,.6)*sg(),dx=R(-.25,.25),z0=R(-.2,.2),dz=R(-.15,.15),tx=R(20,45)*sg(),ty=R(-15,15);
 const tt=tsu?(Math.random()<.5?1/3:2/3):.5;
 let sA=1,sB=1;if(adv){const sm=R(.72,.88),bg=R(1.12,1.25);if(Math.random()<.5){sA=sm;sB=bg}else{sA=bg;sB=sm}}
 const A=build({y:y0,x:x0,z:z0,tx:-tx,ty:-ty,s:sA}),B=build({y:y0+dy,x:x0+dx,z:z0+dz,tx,ty,s:sB}),
 M=build({y:y0+dy*tt,x:x0+dx*tt,z:z0+dz*tt,tx:-tx+2*tx*tt,ty:-ty+2*ty*tt,s:sA+(sB-sA)*tt});
 r={A,B,M,t:tt,tsu};if(ok(A)&&ok(B)&&ok(M))break}
 let c=[0,1,2,3,4,5,6,7].filter(i=>r.A.vv[i]&&r.B.vv[i]);if(c.length<2)c=[0,1,2,3,4,5,6,7].filter(i=>r.A.vv[i]);
 c.sort(()=>Math.random()-.5);r.k=[c[0],c[1]];return r}

/* ===== 描画 ===== */
function seg(a,b,col,w,dash){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.stroke();ctx.setLineDash([])}
function cube(o,col,w,showHidden,hcol){o.E.forEach(e=>{if(e.vis)seg(e.a,e.b,col,w);else if(showHidden)seg(e.a,e.b,hcol||col,1.5,[5,5])})}
function mark(o,i,kind,col){const c=o.P.reduce((s,p)=>[s[0]+p[0]/8,s[1]+p[1]/8],[0,0]),p=o.P[i];let dx=p[0]-c[0],dy=p[1]-c[1];const l=Math.hypot(dx,dy)||1,x=p[0]+dx/l*15,y=p[1]+dy/l*15;
 ctx.beginPath();if(kind===0){for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,r=j%2?4:9;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}}else{for(let j=0;j<3;j++){const a=-Math.PI/2+j*2*Math.PI/3;ctx.lineTo(x+Math.cos(a)*9,y+Math.sin(a)*9)}}
 ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([]);ctx.stroke()}
function userLines(L,col,w){L.forEach(s=>{ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash([]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()})}
function draw(){if(playing){drawPlay();return}
 ctx.clearRect(0,0,W,H);ctx.strokeStyle='#eee';ctx.lineWidth=1;ctx.setLineDash([]);for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 const{A,B,M,k}=q;
 if(hint){M.E.forEach(e=>{if(!e.vis)seg(e.a,e.b,'#9ca3af',1.5,[4,5])});M.P.forEach((p,i)=>{ctx.beginPath();ctx.arc(p[0],p[1],5,0,7);ctx.fillStyle=M.vv[i]?'#16a34a':'#fff';ctx.fill();ctx.strokeStyle='#16a34a';ctx.lineWidth=2;ctx.stroke()})}
 cube(A,'#e5383b',2.5,hint,'#f5a3a6');cube(B,'#38bdf8',2.5,hint,'#a5dcf6');
 if(result){cube(M,'#16a34a',2.5,true,'#86c99a');mark(M,k[0],0,'#16a34a');mark(M,k[1],1,'#16a34a')}
 userLines(drafts,'#b8b8b8',2);userLines(strokes,'#111',3);
 mark(A,k[0],0,'#e5383b');mark(A,k[1],1,'#e5383b');mark(B,k[0],0,'#0ea5e9');mark(B,k[1],1,'#0ea5e9')}

/* ===== 振り返り再生：赤→描いた→水色→描いた→赤…（24fps・3コマ打ち・白線） ===== */
function drawPlay(f=pf){ctx.setLineDash([]);ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
 if(f===0)cube(q.A,'#fff',2.5,false);else if(f===2)cube(q.B,'#fff',2.5,false);else userLines(strokes,'#fff',3)}
function loop(now){if(!playing)return;const f=Math.floor(Math.max(0,now-t0)/(3000/24))%4;if(f!==pf){pf=f;drawPlay()}raf=requestAnimationFrame(loop)}
function startPlay(){if(!result||playing)return;playing=true;pf=0;t0=performance.now();$('res').style.visibility='hidden';$('pl').textContent=T('stop');drawPlay();raf=requestAnimationFrame(loop)}
function stopPlay(){if(!playing)return;playing=false;cancelAnimationFrame(raf);$('res').style.visibility='';$('pl').textContent=T('play');draw()}

/* ===== GIF書き出し（外部ライブラリなし・24fpsの3コマ打ち＝0.125秒） ===== */
let gifBusy=false,gifBlob=null,gifUrl='';
function saveGif(){if(!gifBlob)return;
 try{const f=new File([gifBlob],'dessin-wari.gif',{type:'image/gif'});
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}}catch(_){}
 const a=document.createElement('a');a.href=gifUrl;a.download='dessin-wari.gif';document.body.appendChild(a);a.click();a.remove()}
function closeGif(){$('gv').hidden=true;$('gimg').removeAttribute('src')}
function lzw(idx,mc){const clear=1<<mc,eoi=clear+1,out=[];let cur=0,cb=0,bits=mc+1,next=eoi+1,dict=new Map();
 const emit=c=>{cur|=c<<cb;cb+=bits;while(cb>=8){out.push(cur&255);cur>>=8;cb-=8}};
 emit(clear);let p=idx[0];
 for(let i=1;i<idx.length;i++){const k=idx[i],key=p*256+k,v=dict.get(key);
  if(v!==undefined){p=v;continue}
  emit(p);
  if(next<4096){const c=next++;dict.set(key,c);if(c===(1<<bits))bits++}
  else{emit(clear);dict=new Map();bits=mc+1;next=eoi+1}
  p=k}
 emit(p);emit(eoi);if(cb>0)out.push(cur&255);return out}
const FOOT=56;let gifStamp='';
function stampNow(){const d=new Date(),p=v=>String(v).padStart(2,'0'),hm=p(d.getHours())+':'+p(d.getMinutes());
 return lang==='ja'?d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+hm}
function gifBox(){let a=1e9,b=1e9,c=-1e9,d=-1e9;const add=p=>{a=Math.min(a,p[0]);c=Math.max(c,p[0]);b=Math.min(b,p[1]);d=Math.max(d,p[1])};
 [q.A,q.B].forEach(o=>o.E.forEach(e=>{if(e.vis){add(e.a);add(e.b)}}));strokes.forEach(s=>s.forEach(add));
 const m=24,bw=Math.min(W,Math.max(Math.ceil(c-a+2*m),300)),bh=Math.min(H,Math.ceil(d-b+2*m));
 return{x:Math.round(Math.max(0,Math.min(W-bw,(a+c)/2-bw/2))),y:Math.round(Math.max(0,Math.min(H-bh,(b+d)/2-bh/2))),w:bw,h:bh}}
function drawFoot(bw,bh){ctx.setLineDash([]);ctx.fillStyle='#111';ctx.fillRect(0,bh,bw,FOOT);
 ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(16,bh+.5);ctx.lineTo(bw-16,bh+.5);ctx.stroke();
 ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 15px '+FONT;ctx.fillText(T('gtitle'),bw/2,bh+17);
 ctx.textAlign='left';ctx.font='bold 18px '+FONT;ctx.fillText(rs.s+(lang==='ja'?'点':' pts'),16,bh+40);
 ctx.textAlign='right';ctx.font='13px '+FONT;ctx.fillStyle='#ccc';ctx.fillText(gifStamp,bw-16,bh+40)}
function frameIdx(f,sc,bx){const oc=document.createElement('canvas');oc.width=bx.w*sc;oc.height=(bx.h+FOOT)*sc;const sv=ctx;let d;
 try{ctx=oc.getContext('2d');ctx.save();ctx.scale(sc,sc);ctx.translate(-bx.x,-bx.y);drawPlay(f);ctx.restore();ctx.scale(sc,sc);drawFoot(bx.w,bx.h);d=ctx.getImageData(0,0,oc.width,oc.height).data}finally{ctx=sv}
 const o=new Uint8Array(oc.width*oc.height);for(let i=0;i<o.length;i++){const v=Math.round((d[i*4]-17)/238*31);o[i]=v<0?0:v>31?31:v}return o}
function exportGif(){if(!result||gifBusy)return;gifBusy=true;$('gif').textContent=T('gifBusy');
 setTimeout(()=>{try{
  gifStamp=stampNow();
  const bx=gifBox(),sc=2,w=bx.w*sc,h=(bx.h+FOOT)*sc,fr=[0,1,2].map(f=>lzw(frameIdx(f,sc,bx),5)),seq=[0,1,2,1],dl=[12,13,12,13],b=[];
  const u16=v=>b.push(v&255,(v>>8)&255),str=s=>{for(const c of s)b.push(c.charCodeAt(0))};
  str('GIF89a');u16(w);u16(h);b.push(0xF4,0,0);
  for(let i=0;i<32;i++){const g=Math.round(17+238*i/31);b.push(g,g,g)}
  b.push(0x21,0xFF,0x0B);str('NETSCAPE2.0');b.push(3,1,0,0,0);
  seq.forEach((s,j)=>{b.push(0x21,0xF9,4,0x04);u16(dl[j]);b.push(0,0,0x2C);u16(0);u16(0);u16(w);u16(h);b.push(0,5);
   const d=fr[s];for(let i=0;i<d.length;i+=255){const c=d.slice(i,i+255);b.push(c.length);for(const x of c)b.push(x)}b.push(0)});
  b.push(0x3B);
  gifBlob=new Blob([Uint8Array.from(b)],{type:'image/gif'});if(gifUrl)URL.revokeObjectURL(gifUrl);gifUrl=URL.createObjectURL(gifBlob);
  $('gimg').src=gifUrl;$('gv').hidden=false;
 }catch(err){console.error(err)}
 gifBusy=false;$('gif').textContent=T('gif')},30)}

/* ===== 描画スペースの入力（ペン・指・マウス共通） ===== */
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
const cur=l=>l?strokes:drafts;
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(result||playing)return;
 if(e.pointerType==='touch'&&Math.max(e.width||0,e.height||0)>80)return; /* 手のひらなど大きな接触は無視 */
 if(drawing){if(e.pointerType==='pen'&&ptype!=='pen')endStroke();else return} /* 描画中の別の接触は無視（ペン優先） */
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 pid=e.pointerId;ptype=e.pointerType;dl=layer;cur(dl).push([pt(e)]);drawing=true;draw()});
window.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==pid)return;e.preventDefault();
 const s=cur(dl)[cur(dl).length-1],ev=e.getCoalescedEvents?e.getCoalescedEvents():[];(ev.length?ev:[e]).forEach(x=>s.push(pt(x)));draw()});
function endStroke(){if(!drawing)return;drawing=false;pid=null;ptype='';const L=cur(dl);if(L.length&&L[L.length-1].length<3)L.pop();draw()}
['pointerup','pointercancel'].forEach(t=>window.addEventListener(t,e=>{if(drawing&&e.pointerId===pid)endStroke()}));

/* ===== 描画スペース以外は何も反応させない（スクロール・拡大・選択・長押しメニューなど） ===== */
const onGif=e=>e.target.closest&&e.target.closest('#gimg');
document.addEventListener('touchstart',e=>{if(!onGif(e))e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{if(!onGif(e))e.preventDefault()},{passive:false});
['gesturestart','gesturechange','gestureend','contextmenu','dragstart','selectstart'].forEach(t=>document.addEventListener(t,e=>{if(!onGif(e))e.preventDefault()}));

/* ===== ボタン：指でもペン先でもマウスでも反応（離した位置がボタン付近なら実行） ===== */
function bind(el,fn){let id=null;
 const inside=e=>{const r=el.getBoundingClientRect(),m=8;return e.clientX>=r.left-m&&e.clientX<=r.right+m&&e.clientY>=r.top-m&&e.clientY<=r.bottom+m};
 el.addEventListener('pointerdown',e=>{e.preventDefault();if(drawing&&e.pointerType==='touch')return;id=e.pointerId;el.classList.add('press')});
 el.addEventListener('pointerup',e=>{const hit=id===e.pointerId&&inside(e);id=null;el.classList.remove('press');if(hit&&!(drawing&&e.pointerType==='touch'))fn()});
 el.addEventListener('pointercancel',()=>{id=null;el.classList.remove('press')});
 el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){id=null;el.classList.remove('press')}});
 el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}});
 el.addEventListener('click',e=>e.preventDefault())}

/* ===== 採点 ===== */
function samp(pts,step){const o=[];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]),m=Math.max(1,Math.ceil(l/step));for(let j=0;j<=m;j++)o.push([a[0]+(b[0]-a[0])*j/m,a[1]+(b[1]-a[1])*j/m])}return o}
const near=(p,L)=>{let m=1e9;for(const r of L){const d=(p[0]-r[0])**2+(p[1]-r[1])**2;if(d<m)m=d}return Math.sqrt(m)};
const cred=d=>Math.exp(-Math.pow(d/14,2));
function score(){
 if(!strokes.length){rs={none:1};renderRes();return}
 const ans=[];q.M.E.forEach(e=>{if(e.vis)ans.push(...samp([e.a,e.b],3))});
 const us=[];strokes.forEach(s=>us.push(...samp(s,3)));
 const rec=ans.reduce((s,p)=>s+cred(near(p,us)),0)/ans.length,pre=us.reduce((s,p)=>s+cred(near(p,ans)),0)/us.length;
 const s=Math.round(100*2*rec*pre/(rec+pre+1e-9));
 result=true;n++;rs={s,n,hint};syncBtns();draw();renderRes()}
function renderRes(){const r=$('res');if(!rs){r.style.display='none';return}r.style.display='block';
 if(rs.none){r.textContent=T('noStroke');return}
 const c=T(rs.s>=90?'cm0':rs.s>=75?'cm1':rs.s>=55?'cm2':'cm3'),qs=T('qn').replace('{n}',rs.n)+(rs.hint?T('hu'):'');
 r.innerHTML='<div><span class="tag">'+T('rv')+'</span><b>'+rs.s+'</b> '+T('pt')+c+'</div><div class="msg">'+T('note').replace('{q}',qs)+'</div>'}

/* ===== 画面の状態 ===== */
function syncBtns(){$('go').hidden=result;$('gif').hidden=!result;$('lyr').hidden=result;$('plr').hidden=!result;$('pl').textContent=T(playing?'stop':'play')}
function tsumeUI(){const e=$('tsume'),on=!!(q&&q.tsu);e.hidden=!on;if(on){$('tst').textContent=T(q.t<.5?'tsR':'tsB');$('tsm').style.left=(q.t*100)+'%'}}
function hintMsg(){$('hint').textContent=T(['h0','h1',ADV_TSUME?'h2':'h2n'][course])}
function hbLabel(){$('hb').textContent=T(hint?'hbOff':'hb')}
function apply(){document.documentElement.lang=lang;document.title=T('title');
 document.querySelectorAll('[data-i]').forEach(el=>el.textContent=T(el.dataset.i));
 $('lang').textContent=T('langBtn');hbLabel();syncBtns();hintMsg();tsumeUI();renderRes();if(q)draw()}
function setLang(l){lang=l;try{localStorage.setItem('dw-lang',l)}catch(_){}apply()}
function setLayer(l){layer=l;$('l0').classList.toggle('on',!l);$('l1').classList.toggle('on',!!l)}
function start(){stopPlay();q=gen();strokes=[];drafts=[];setLayer(0);result=false;drawing=false;pid=null;hint=false;rs=null;
 $('hb').classList.remove('on');hbLabel();syncBtns();$('res').style.display='none';hintMsg();tsumeUI();draw()}
function setCourse(c){if(c===course)return;course=c;n=0;[0,1,2].forEach(i=>$('k'+i).classList.toggle('on',i===c));start()}

bind($('lang'),()=>setLang(lang==='ja'?'en':'ja'));
[0,1,2].forEach(i=>bind($('k'+i),()=>setCourse(i)));
bind($('l0'),()=>setLayer(0));bind($('l1'),()=>setLayer(1));
bind($('hb'),()=>{hint=!hint;$('hb').classList.toggle('on',hint);hbLabel();draw()});
bind($('undo'),()=>{if(!result&&!drawing){cur(layer).pop();draw()}});
bind($('clr'),()=>{stopPlay();cur(layer).length=0;result=false;rs=null;syncBtns();$('res').style.display='none';draw()});
bind($('go'),()=>{if(!result)score()});
bind($('pl'),()=>{playing?stopPlay():startPlay()});
bind($('gif'),exportGif);bind($('gsave'),saveGif);bind($('gclose'),closeGif);
bind($('nx'),start);

/* ===== 画面に収める（スクロール不要） ===== */
/* 描画スペースは上に詰めて配置：他の行の高さを引いた残りに収まる大きさにする */
function fit(){const w=document.querySelector('.wrap'),cs=getComputedStyle(w),pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom),gap=parseFloat(cs.rowGap)||6,
 bw=w.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);let used=0,cnt=0;
 for(const el of w.children){if(el.id==='cw'||!el.offsetHeight)continue;used+=el.offsetHeight;cnt++}
 const avail=w.clientHeight-pad-used-gap*cnt,k=Math.min(bw/W,avail/H);if(!(k>0))return;
 const v=$('cv');v.style.width=Math.floor(W*k)+'px';v.style.height=Math.floor(H*k)+'px'}
if(window.ResizeObserver){const ro=new ResizeObserver(fit);for(const el of document.querySelector('.wrap').children)if(el.id!=='cw')ro.observe(el)}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);

apply();start();fit();
</script></body></html>
